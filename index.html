<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b16">
<title>Shadow Build</title>
<style>
:root{--bg:#060b16;--panel:#0b1426;--panel2:#0f1c33;--line:#1f3a66;--glow:#3fa9ff;--glow2:#7cc8ff;--text:#e6f0ff;--muted:#8ea4c4;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{background:radial-gradient(ellipse at top,#0d1d3a 0%,var(--bg) 60%) fixed;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:rgba(6,11,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px calc(8px) }
h1{margin:0;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--glow2);text-shadow:0 0 10px rgba(63,169,255,.6)}
.sub{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
nav button,.chip{flex:1 1 auto;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;cursor:pointer}
nav button.on,.chip.on{border-color:var(--glow);box-shadow:0 0 0 1px var(--glow),0 0 14px rgba(63,169,255,.45);color:var(--glow2)}
main{max-width:760px;margin:0 auto;padding:12px}
.win{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--glow);border-radius:14px;box-shadow:0 0 18px rgba(63,169,255,.22),inset 0 0 22px rgba(63,169,255,.06);padding:14px;margin:12px 0}
.win h2{margin:0 0 8px;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--glow2)}
.win h3{margin:0;font-size:17px}
.muted{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ex{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:rgba(10,20,40,.6)}
.exhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:baseline}
.tag{font-size:13px;color:var(--glow2);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.fig{width:100%;max-width:340px;display:block;margin:8px auto}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:8px}
.sets label{font-size:13px;color:var(--muted);display:block;text-align:center}
input[type=number],input[type=date],select{width:100%;min-height:48px;font-size:18px;text-align:center;background:#07101f;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px}
input:focus,select:focus{outline:none;border-color:var(--glow);box-shadow:0 0 10px rgba(63,169,255,.5)}
select{text-align:left;font-size:16px}
.btn{min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--glow);background:rgba(63,169,255,.12);color:var(--glow2);font-size:16px;font-weight:600;cursor:pointer;letter-spacing:.04em}
.btn.primary{background:var(--glow);color:#03101f;box-shadow:0 0 16px rgba(63,169,255,.6)}
.btn.small{min-height:44px;font-size:15px;padding:6px 12px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>*{flex:1 1 140px}
details summary{cursor:pointer;color:var(--glow2);min-height:44px;padding-top:10px}
ol{margin:6px 0;padding-left:20px}
ol li{margin:4px 0}
.target{font-size:13px;color:var(--ok)}
.last{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
td.n{text-align:right}
#timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(6,11,22,.96);border-top:1px solid var(--glow);box-shadow:0 -4px 20px rgba(63,169,255,.3);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
#timer .t{font-size:24px;flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--glow2);min-width:80px;text-shadow:0 0 10px rgba(63,169,255,.6)}
#timer .btn{flex:1 1 0;min-width:0;padding:6px 4px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--glow);padding:10px 16px;border-radius:10px;z-index:30;box-shadow:0 0 16px rgba(63,169,255,.5)}
.hidden{display:none}
.chart{width:100%;height:auto;display:block}
.done{color:var(--ok)}
/* week bar */
.weekbar{padding:10px}
.wkhead{display:flex;gap:6px;align-items:center}
.wkhead .lbl{flex:1 1 auto;text-align:center;font-size:16px;color:var(--glow2);letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.wkhead .lbl .muted{text-transform:none;letter-spacing:0}
.btn.arrow{flex:0 0 52px;font-size:26px;line-height:1;padding:0}
#wktoday{flex:0 0 auto;padding:10px 14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px;touch-action:pan-y}
.dchip{min-height:80px;padding:6px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font:inherit;-webkit-tap-highlight-color:transparent}
.dchip .wd{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dchip .dn{font-size:22px;font-weight:700;line-height:1.15}
.dchip .st{font-size:13px;min-height:19px;color:var(--muted);font-weight:600}
.dchip.today{border-color:var(--glow2)}
.dchip.today .wd,.dchip.today .st{color:var(--glow2)}
.dchip.rest .st{color:#4a5d7d;font-weight:400}
.dchip.logged{border-color:var(--ok);box-shadow:0 0 10px rgba(74,222,128,.35),inset 0 0 12px rgba(74,222,128,.12)}
.dchip.logged .st{color:var(--ok)}
.dchip.sel{background:linear-gradient(180deg,#1b4f8f,#123866);border-color:var(--glow);box-shadow:0 0 0 2px var(--glow),0 0 18px rgba(63,169,255,.7)}
.dchip.sel .wd{color:var(--glow2)}
.dchip.sel.logged{box-shadow:0 0 0 2px var(--ok),0 0 18px rgba(74,222,128,.55)}
.restnote{color:var(--muted);font-size:15px;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:12px;margin:12px 0}
.chips.sess .chip{font-size:15px;min-height:48px}
.sname{font-size:20px!important;color:var(--glow2)}
.sumex{border-top:1px solid var(--line);padding:10px 0}
.sumname{font-size:17px;font-weight:600}
.sumsets{font-size:18px;font-variant-numeric:tabular-nums;color:var(--text)}
.note{font-size:15px;color:var(--warn);margin-top:2px}
.sumtot{border-top:1px solid var(--line);padding:12px 0;font-size:17px}
input[type=text]{width:100%;min-height:48px;font-size:16px;background:#07101f;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:8px}
.btn.small[data-rest]{width:100%;margin:2px 0 6px}
/* NEXT UP hero */
.hero{position:relative;border-color:var(--glow2);background:radial-gradient(120% 90% at 0% 0%,rgba(63,169,255,.22),transparent 60%),linear-gradient(180deg,#10254a,#0a1529);box-shadow:0 0 0 1px rgba(124,200,255,.35),0 0 28px rgba(63,169,255,.45),inset 0 0 30px rgba(63,169,255,.12);padding:16px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kicker{font-size:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--glow2);text-shadow:0 0 10px rgba(63,169,255,.8)}
.kicker .muted{letter-spacing:.04em;text-transform:none;font-weight:400}
.dtoday{margin-top:8px;font-size:16px;font-weight:700;color:var(--ok);text-shadow:0 0 10px rgba(74,222,128,.5)}
.htitle{margin:6px 0 8px;font-size:28px;font-weight:800;line-height:1.15;color:#fff;text-shadow:0 0 14px rgba(63,169,255,.85)}
.hex{list-style:none;margin:0 0 10px;padding:0}
.hex li{display:flex;gap:8px;align-items:baseline;font-size:15px;padding:3px 0;border-top:1px solid rgba(31,58,102,.7)}
.hex li:first-child{border-top:0}
.hex .n{flex:0 0 22px;font-size:13px;color:var(--glow2);font-weight:700}
.rot{display:flex;gap:6px;margin:10px 0 8px}
.pill{flex:1 1 0;min-height:36px;border-radius:999px;border:1px solid var(--line);background:rgba(7,16,31,.8);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:700}
.pill.done{border-color:var(--ok);color:var(--ok);background:rgba(74,222,128,.08)}
.pill.next{border-color:var(--glow2);color:#03101f;background:var(--glow);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 1px var(--glow),0 0 8px rgba(63,169,255,.45)}50%{box-shadow:0 0 0 3px rgba(124,200,255,.9),0 0 22px rgba(124,200,255,.9)}}
.hmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:12px}
.btn.big{width:100%;min-height:56px;font-size:19px;letter-spacing:.08em;text-transform:uppercase}
/* week bar: next target day */
.dchip{position:relative}
.dchip.next::after{content:"";position:absolute;inset:-3px;border:2px solid var(--glow2);border-radius:14px;pointer-events:none;animation:ring 2s ease-in-out infinite}
@keyframes ring{0%,100%{opacity:.35;box-shadow:0 0 4px rgba(124,200,255,.3)}50%{opacity:1;box-shadow:0 0 16px rgba(124,200,255,.9)}}
.dchip.next .st{color:#fff;text-shadow:0 0 8px var(--glow)}
.nx{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:13px;line-height:16px;font-weight:800;letter-spacing:.02em;padding:0 3px;border-radius:6px;background:var(--glow);color:#03101f;box-shadow:0 0 10px rgba(63,169,255,.8);z-index:1}
/* session chips: Next badge */
.chip.sug{border-color:var(--glow2)}
.nexttag{display:inline-block;margin-left:6px;font-size:13px;font-weight:800;letter-spacing:.06em;padding:0 6px;border-radius:6px;background:var(--glow);color:#03101f;vertical-align:1px}
@media (prefers-reduced-motion:reduce){.pill.next,.dchip.next::after{animation:none}}
</style>
<link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#060b16">
</head>

const GO="straight into partner", REST="rest 60–75 s";
const PLAN={
 "Day A":{label:"A · Squat + Push",slots:[["Superset 1","goblet",4,GO],["Superset 1","pushup",4,REST],["Superset 2","row1",3,GO],["Superset 2","latraise",3,REST],["Superset 3","ohtri",3,GO],["Superset 3","situp",3,"rest 45 s"]]},
 "Day B":{label:"B · Hinge + Press",slots:[["Superset 1","rdl",4,GO],["Superset 1","floorpress",4,REST],["Superset 2","row2",3,GO],["Superset 2","uprow",3,REST],["Superset 3","curl",3,GO],["Superset 3","legraise",3,"rest 45 s"]]},
 "Walk + Core":{label:"Walk + Core",slots:[["Treadmill","walk",1,"then core"],["Core","plank",3,"rest 45 s"]]},
 "Day C":{label:"C · Single-leg + Pull",slots:[["Superset 1","bss",4,GO],["Superset 1","row1",4,REST],["Superset 2","pushup",3,GO],["Superset 2","latraise",3,REST],["Superset 3","curl",3,GO],["Superset 3","ohtri",3,"rest 45 s"]]},
 "Day D":{label:"D · Hinge + Overhead",slots:[["Superset 1","rdl",4,GO],["Superset 1","press",4,REST],["Superset 2","lunge",3,GO],["Superset 2","row2",3,REST],["Superset 3","uprow",3,GO],["Superset 3","legraise",3,"rest 45 s"]]}
};
const ROTATION=["Day A","Day B","Walk + Core","Day C","Day D"];

/* ---------------- storage ---------------- */
const KEY="shadowbuild.v1";
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"{}");return{log:Array.isArray(d.log)?d.log:[],body:Array.isArray(d.body)?d.body:[],levels:d.levels||{},draft:d.draft||{}};}catch(e){return{log:[],body:[],levels:{},draft:{}};}}
let S=load();
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
/* dates (local calendar days, YYYY-MM-DD) */
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const pd=s=>new Date(s+"T12:00:00");
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d);};
const monday=s=>{const d=pd(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d);};
const fmt=d=>pd(d).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const fmtLong=d=>pd(d).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
/* migrate v2 drafts (keyed by session) to per-date drafts */
Object.keys(S.draft).forEach(k=>{if(k.indexOf("|")<0){const v=S.draft[k];delete S.draft[k];if(v&&typeof v==="object"&&Object.keys(v).length)S.draft[today()+"|"+k]={sets:v,notes:{},levels:{}};}});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function history(ex,before,skip){const out=[];[...S.log].filter(s=>(!before||s.date<before)&&s!==skip).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>s.entries.forEach(e=>{if(e.ex===ex&&e.sets.length)out.push({date:s.date,sets:e.sets,total:e.sets.reduce((t,r)=>t+r,0),best:Math.max(...e.sets),level:e.level||0});}));return out;}
function nextTarget(ex,h){const e=EX[ex];const[lo,hi]=e.range;if(!h)return"First time: find a weight-free rep count that leaves 1–2 in the tank, aim "+lo+"–"+hi;
 if(h.sets.length&&h.sets.every(r=>r>=hi)){const step=e.ladder[h.level];return step?"Advance → "+step+", restart near "+lo:"Top of ladder: add a set or 5 partials";}
 return"Target "+h.sets.map(r=>Math.min(hi,Math.max(lo,r+1))).join("/")+" "+e.unit;}
const byTime=(a,b)=>(a.date+(a.t||"")).localeCompare(b.date+(b.t||""));
function nextDay(){if(!S.log.length)return ROTATION[0];const last=[...S.log].sort(byTime).pop();const i=ROTATION.indexOf(last.day);return ROTATION[(i+1)%ROTATION.length];}
/* next session in the rotation, from the last session logged before `date` */
function nextDayBefore(date){const prev=S.log.filter(s=>s.date<date).sort(byTime).pop();if(!prev)return ROTATION[0];const i=ROTATION.indexOf(prev.day);return i<0?ROTATION[0]:ROTATION[(i+1)%ROTATION.length];}
const ABBR={"Day A":"A","Day B":"B","Walk + Core":"W","Day C":"C","Day D":"D"};
const abbr=d=>ABBR[d]||(String(d).replace(/^Day\s*/i,"").charAt(0)||"?").toUpperCase();
const logsOn=date=>S.log.filter(s=>s.date===date).sort(byTime);
const label=d=>PLAN[d]?PLAN[d].label:d;
/* "Day B · Hinge + Press" */
const title=d=>PLAN[d]&&/^Day /.test(d)?d+" · "+PLAN[d].label.split(" · ").slice(1).join(" · "):label(d);
const SHORT={goblet:"Goblet squat",pushup:"Push-up",row1:"1-arm row",latraise:"Lateral raise",ohtri:"Overhead triceps",situp:"Weighted sit-up",rdl:"Romanian deadlift",floorpress:"Floor press",row2:"Bent-over row",uprow:"Upright row",curl:"Hammer curl",legraise:"Leg raise",bss:"Bulgarian split squat",press:"Shoulder press",lunge:"Reverse lunge",plank:"Plank",walk:"Incline walk"};
/* what comes next: the target day is today if today isn't logged, otherwise tomorrow */
function nextInfo(){const t=today();const L=logsOn(t);const target=L.length?addDays(t,1):t;const next=nextDayBefore(target);
 const before=S.log.filter(s=>s.date<target).sort(byTime);const prev=before[before.length-1]||null;
 /* sessions done this rotation: walk back while the rotation order keeps descending */
 const ni=ROTATION.indexOf(next);const done=new Set();let cur=ni;
 for(let i=before.length-1;i>=0;i--){const k=ROTATION.indexOf(before[i].day);if(k<0||k>=cur)break;done.add(before[i].day);cur=k;}
 return{t,target,next,prev,doneToday:L.length?L[L.length-1]:null,done};}

/* ---------------- figures ---------------- */
const KEYS=["head","sh","el","ha","hip","kn","ft","el2","ha2","kn2","ft2"];
function full(p){return Object.assign({},p,{el2:p.el2||p.el,ha2:p.ha2||p.ha,kn2:p.kn2||p.kn,ft2:p.ft2||p.ft});}
function figSVG(id,label){const m=MOVES[id];return `<svg class="fig" data-move="${id}" viewBox="0 0 200 135" role="img" aria-label="${esc(label)} demo">
<line x1="10" y1="120" x2="190" y2="120" stroke="#1f3a66" stroke-width="1.5"/>
${m.bench?`<rect x="${m.benchX||56}" y="100" width="28" height="20" rx="3" fill="none" stroke="#5b7298" stroke-width="2"/>`:""}
<polyline class="l1" fill="none" stroke="#2c4f80" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline class="l2" fill="none" stroke="#2c4f80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline class="l3" fill="none" stroke="#3fa9ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 3px #3fa9ff)"/>
<polyline class="l4" fill="none" stroke="#3fa9ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 3px #3fa9ff)"/>
<polyline class="l5" fill="none" stroke="#3fa9ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 3px #3fa9ff)"/>
${m.db?`<rect class="db" width="14" height="7" rx="2" fill="#c9d6ea"/>`:""}
<circle class="hd" r="8" fill="#7cc8ff"/>
<text x="12" y="132" fill="#8ea4c4" font-size="8">${esc(label.toUpperCase())}</text>
<text class="rc" x="188" y="132" text-anchor="end" fill="#8ea4c4" font-size="8"></text></svg>`;}
function tick(ts){document.querySelectorAll("svg.fig").forEach(svg=>{const m=MOVES[svg.dataset.move];if(!m)return;const a=full(m.a),b=full(m.b);const ph=(ts%m.period)/m.period;const u=(1-Math.cos(2*Math.PI*ph))/2;const at=k=>[a[k][0]+(b[k][0]-a[k][0])*u,a[k][1]+(b[k][1]-a[k][1])*u];const pts=ks=>ks.map(k=>at(k).join(",")).join(" ");
 svg.querySelector(".l1").setAttribute("points",pts(["sh","el2","ha2"]));svg.querySelector(".l2").setAttribute("points",pts(["hip","kn2","ft2"]));svg.querySelector(".l3").setAttribute("points",pts(["sh","hip"]));svg.querySelector(".l4").setAttribute("points",pts(["hip","kn","ft"]));svg.querySelector(".l5").setAttribute("points",pts(["sh","el","ha"]));
 const h=at("head");const c=svg.querySelector(".hd");c.setAttribute("cx",h[0]);c.setAttribute("cy",h[1]);const db=svg.querySelector(".db");if(db){const ha=at("ha");db.setAttribute("x",ha[0]-7);db.setAttribute("y",ha[1]-3.5);}
 svg.querySelector(".rc").textContent=m.hold?"HOLD":"REP "+Math.floor(ts/m.period);});requestAnimationFrame(tick);}
requestAnimationFrame(tick);

/* ---------------- chart ---------------- */
function lineChart(points,unit){if(!points.length)return"";const W=340,H=180,pl=36,pr=12,pt=14,pb=28;const vals=points.map(p=>p.v);const max=Math.max(...vals)*1.15||10,min=0;
 const x=i=>pl+(points.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(points.length-1));const y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
 let g="";for(let k=0;k<=4;k++){const v=min+(max-min)*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#16294a"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end" fill="#8ea4c4" font-size="11">${Math.round(v)}</text>`;}
 const lbl=points.map((p,i)=>{const n=points.length;const show=n<=6||[0,1,2,3,4,5].some(k=>Math.round(k*(n-1)/5)===i);return show?`<text x="${x(i)}" y="${H-10}" text-anchor="middle" fill="#8ea4c4" font-size="11">${esc(p.l)}</text>`:"";}).join("");
 const path=points.map((p,i)=>(i?"L":"M")+x(i)+","+y(p.v)).join(" ");
 const area=`M${x(0)},${y(0)} `+points.map((p,i)=>"L"+x(i)+","+y(p.v)).join(" ")+` L${x(points.length-1)},${y(0)} Z`;
 const dots=points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#7cc8ff"/>`).join("");
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="progress chart">${g}<path d="${area}" fill="rgba(63,169,255,.15)"/><path d="${path}" fill="none" stroke="#3fa9ff" stroke-width="2.5" style="filter:drop-shadow(0 0 3px #3fa9ff)"/>${dots}${lbl}<text x="${pl}" y="10" fill="#8ea4c4" font-size="11">${esc(unit)}</text></svg>`;}

/* ---------------- views ---------------- */
let tab="workout", sel=today(), wk=monday(today()), pick={}, editing=null, progEx=null;
const app=document.getElementById("app");
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function renderNav(){const tabs=[["workout","Workout"],["progress","Progress"],["history","History"],["body","Body"],["data","Backup"]];document.getElementById("nav").innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${l}</button>`).join("");}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;render();window.scrollTo(0,0);});

/* the session shown in the logging view for the selected date */
function curDay(){if(pick[sel]&&PLAN[pick[sel]])return pick[sel];if(editing)return PLAN[editing.day]?editing.day:ROTATION[0];return nextDayBefore(sel);}
const dk=()=>sel+"|"+curDay();
function draftFor(k){let d=S.draft[k];if(!d||!d.sets){d=S.draft[k]={sets:{},notes:{},levels:{}};}if(!d.notes)d.notes={};if(!d.levels)d.levels={};return d;}
function selectDate(d){sel=d;wk=monday(d);editing=null;}
function shiftWeek(n){wk=addDays(wk,7*n);const t=today();sel=monday(t)===wk?t:addDays(wk,(pd(sel).getDay()+6)%7);editing=null;render();}

function heroCard(){const N=nextInfo();const plan=PLAN[N.next];const groups=[];plan.slots.forEach(([blk,ex])=>{let g=groups.find(x=>x.blk===blk);if(!g)groups.push(g={blk,ex:[]});if(!g.ex.includes(ex))g.ex.push(ex);});
 const when=N.target===N.t?"today":"tomorrow · "+pd(N.target).toLocaleDateString("en-US",{weekday:"short"});
 const ago=N.prev?(N.prev.date===N.t?"today":(pd(N.t)-pd(N.prev.date))/864e5<7?pd(N.prev.date).toLocaleDateString("en-US",{weekday:"short"}):fmt(N.prev.date)):"";
 return `<section class="win hero" id="nextup" data-next="${esc(N.next)}" data-target="${N.target}" aria-label="Next up"><div class="hhead"><div class="kicker">Next up <span class="muted">· ${esc(when)}</span></div><span class="tag">~30 min</span></div>
 ${N.doneToday?`<div class="dtoday" id="donetoday">Done today ✓ (${esc(N.doneToday.day)})</div>`:""}
 <div class="htitle" id="nexttitle">${esc(title(N.next))}</div>
 <ul class="hex">${groups.map((g,i)=>`<li><span class="n">${i+1}</span><span>${g.ex.map(x=>esc(SHORT[x]||EX[x].name)).join(" + ")}</span></li>`).join("")}</ul>
 <div class="rot" id="rot" aria-label="Rotation">${ROTATION.map(d=>{const c=d===N.next?"next":N.done.has(d)?"done":"";return `<span class="pill ${c}" data-rot="${esc(abbr(d))}" title="${esc(label(d))}">${esc(abbr(d))}${c==="done"?" ✓":""}</span>`;}).join("")}</div>
 <div class="hmeta"><span id="lastdone">${N.prev?"Last: "+esc(N.prev.day)+" · "+esc(ago):"No sessions yet · rotation starts at Day A"}</span><span>A → B → W → C → D</span></div>
 ${N.target===N.t?`<button class="btn primary big" id="startnext">Start today</button>`:`<button class="btn big" id="startnext" data-start="${N.target}">Preview tomorrow</button>`}</section>`;}

function weekBar(){const t=today();const N=nextInfo();const days=[...Array(7)].map((_,i)=>addDays(wk,i));const range=fmt(days[0])+" – "+fmt(days[6]);
 const cur=monday(t);const title=wk===cur?"This week":wk===addDays(cur,-7)?"Last week":wk===addDays(cur,7)?"Next week":pd(wk).getFullYear()!==pd(t).getFullYear()?String(pd(days[6]).getFullYear()):"Week";
 return `<section class="win weekbar" aria-label="Week"><div class="wkhead"><button class="btn arrow" id="wkprev" aria-label="Previous week">‹</button><div class="lbl" id="wklabel">${esc(title)}<div class="muted">${esc(range)}</div></div><button class="btn arrow" id="wknext" aria-label="Next week">›</button><button class="btn" id="wktoday">Today</button></div>
 <div class="week" id="week">${days.map(d=>{const L=logsOn(d);const c=["dchip"];if(d===t)c.push("today");if(d===sel)c.push("sel");if(L.length)c.push("logged");else if(d<t)c.push("rest");const isN=d===N.target&&!L.length;if(isN)c.push("next");
  const st=L.length?"✓ "+L.map(x=>abbr(x.day)).join(""):isN?abbr(N.next):d===t?"today":d<t?"rest":"";
  return `<button class="${c.join(" ")}" data-date="${d}" aria-pressed="${d===sel}" aria-label="${esc(fmtLong(d))}${L.length?", logged "+esc(L.map(x=>x.day).join(", ")):""}${isN?", next: "+esc(N.next):""}">${isN?`<span class="nx">NEXT</span>`:""}<span class="wd">${pd(d).toLocaleDateString("en-US",{weekday:"short"})}</span><span class="dn">${pd(d).getDate()}</span><span class="st">${esc(st)}</span></button>`;}).join("")}</div></section>`;}

function summaryView(L){return L.map(s=>{const idx=S.log.indexOf(s);const tot=s.entries.reduce((t,e)=>t+e.sets.length,0);
 return `<section class="win summary" data-summary="${esc(s.date)}"><h2>${esc(fmtLong(s.date))} · Quest complete</h2><div class="exhead"><h3 class="sname">${esc(label(s.day))}</h3><span class="tag done">✓ ${tot} sets</span></div>
 ${s.entries.map(e=>{const x=EX[e.ex];return `<div class="sumex"><div class="sumname">${esc(x?x.name:e.ex)}</div><div class="sumsets">${e.sets.length} × ${esc(e.sets.join(" / "))} <span class="muted">${esc(x?x.unit:"reps")}</span></div>${e.level?`<div class="muted">Level: step ${esc(e.level)}${x&&x.ladder[e.level-1]?" · "+esc(x.ladder[e.level-1]):""}</div>`:`<div class="muted">Level: base</div>`}${e.note?`<div class="note">Note: ${esc(e.note)}</div>`:""}</div>`;}).join("")}
 <div class="sumtot">Total <b>${tot}</b> sets · ${s.entries.length} exercise${s.entries.length===1?"":"s"}</div>
 <div class="row"><button class="btn primary" data-edit="${idx}">Edit</button><button class="btn danger" data-delentry="${idx}">Delete</button></div></section>`;}).join("");}

function logView(){const d=curDay();const plan=PLAN[d];const dr=draftFor(dk());const t=today();const sug=nextDayBefore(sel);
 let h="";
 if(!editing&&sel<t)h+=`<div class="restnote" id="restnote">Rest day · nothing logged. Trained that day? Fill it in below.</div>`;
 if(!editing&&sel>t)h+=`<div class="restnote">Upcoming day. Planned session shown below.</div>`;
 h+=`<section class="win" id="logwin"><h2>${editing?"Editing":"Log"} · ${esc(fmtLong(sel))}</h2><div class="chips sess">${ROTATION.map(x=>`<button class="chip ${x===d?"on":""}${x===sug?" sug":""}" data-day="${esc(x)}">${esc(PLAN[x].label)}${x===sug?`<span class="nexttag">Next</span>`:""}</button>`).join("")}</div><p class="muted">Next = the next session in your rotation after your last logged session. Tap another to switch. 3 min warm-up, then supersets: exercise 1 → exercise 2 → rest. Stop most sets 1–3 reps from failure; last set 0–1.</p></section>`;
 let lastBlock="";
 plan.slots.forEach(([block,ex,sets,rest],idx)=>{const e=EX[ex];const key=ex+"#"+idx;const hist=history(ex,sel,editing);const last=hist[hist.length-1];const lvl=dr.levels[ex]!=null?dr.levels[ex]:(S.levels[ex]||0);
  if(block!==lastBlock){if(lastBlock)h+=`</section>`;h+=`<section class="win"><h2>${esc(block)}</h2>`;lastBlock=block;}
  const vals=dr.sets[key]||[];const n=Math.max(sets,vals.length);
  h+=`<div class="ex"><div class="exhead"><h3>${esc(e.name)}</h3><span class="tag">${sets} × ${e.range[0]}–${e.range[1]} ${esc(e.unit)} · ${esc(rest)}</span></div>
  <div class="muted">${esc(e.hits)}</div>${figSVG(e.move,e.name)}
  <details><summary>Form cues</summary><ol>${e.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></details>
  <label class="muted">Version (progression ladder)<select data-level="${ex}"><option value="0"${lvl===0?" selected":""}>Base: as described</option>${e.ladder.map((s,i)=>`<option value="${i+1}"${lvl===i+1?" selected":""}>Step ${i+1}: ${esc(s)}</option>`).join("")}</select></label>
  <div class="last">${last?"Last ("+fmt(last.date)+"): "+last.sets.join("/"):"No history yet"}</div>
  <div class="target">${esc(nextTarget(ex,last))}</div>
  <div class="sets">${Array.from({length:n},(_,i)=>`<div><label>Set ${i+1}</label><input type="number" inputmode="numeric" min="0" max="999" data-key="${esc(key)}" data-i="${i}" value="${vals[i]!=null?vals[i]:""}" placeholder="${last&&last.sets[i]!=null?last.sets[i]:"–"}"></div>`).join("")}</div>
  <input type="text" data-note="${ex}" maxlength="200" placeholder="Note (optional)" value="${esc(dr.notes[ex]||"")}"></div>`;
  if(rest.startsWith("rest")){const sec=rest.includes("45")?45:75;h+=`<button class="btn small" data-rest="${sec}">Start ${sec} s rest</button>`;}
 });
 const extra=(dr.extra||[]);
 h+=`</section><section class="win"><h2>${editing?"Save changes":"Complete session"}</h2>${extra.length?`<p class="muted">Also kept from this entry: ${extra.map(x=>esc(EX[x.ex]?EX[x.ex].name:x.ex)+" "+esc(x.sets.join("/"))).join(", ")}</p>`:""}
 <button class="btn primary" id="finish" style="width:100%">Save ${esc(plan.label)} · ${esc(fmtLong(sel))}</button>
 ${editing?`<div class="row" style="margin-top:8px"><button class="btn" id="canceledit">Cancel</button><button class="btn danger" data-delentry="${S.log.indexOf(editing)}">Delete</button></div>`:""}
 <p class="muted">Saves the reps you entered for this date on this device${editing?", replacing the old entry":""}. Empty sets are skipped.</p></section>`;
 return h;}

function workoutView(){if(editing&&S.log.indexOf(editing)<0)editing=null;const L=logsOn(sel);return heroCard()+weekBar()+(L.length&&!editing?summaryView(L):logView());}

function progressView(){const exs=[...new Set(S.log.flatMap(s=>s.entries.map(e=>e.ex)))].filter(x=>EX[x]);
 if(!exs.length)return`<section class="win"><h2>Progress</h2><p class="muted">Log a session to see charts, records and targets.</p></section>`;
 if(!progEx||!exs.includes(progEx))progEx=exs[0];const hs=history(progEx);
 const weekAgo=Date.now()-7*864e5;const wk=S.log.filter(s=>new Date(s.date+"T12:00:00").getTime()>=weekAgo).length;
 let h=`<section class="win"><h2>Status</h2><div class="row"><div><div style="font-size:28px;color:var(--glow2)">${wk} / 5</div><div class="muted">sessions, last 7 days</div></div><div><div style="font-size:28px;color:var(--glow2)">${S.log.length}</div><div class="muted">sessions total</div></div></div></section>`;
 h+=`<section class="win"><h2>Total ${esc(EX[progEx].unit.split(" ")[0])} per session</h2><select id="progEx">${exs.map(x=>`<option value="${x}"${x===progEx?" selected":""}>${esc(EX[x].name)}</option>`).join("")}</select>${lineChart(hs.map(p=>({l:fmt(p.date),v:p.total})),EX[progEx].unit)}</section>`;
 h+=`<section class="win"><h2>Records · next targets</h2><table><thead><tr><th>Exercise</th><th class="n">Best set</th><th class="n">Best total</th><th>Next</th></tr></thead><tbody>${exs.map(x=>{const hh=history(x);return`<tr><td>${esc(EX[x].name)}</td><td class="n">${Math.max(...hh.map(p=>p.best))}</td><td class="n">${Math.max(...hh.map(p=>p.total))}</td><td>${esc(nextTarget(x,hh[hh.length-1]))}</td></tr>`;}).join("")}</tbody></table></section>`;
 return h;}

function historyView(){if(!S.log.length)return`<section class="win"><h2>History</h2><p class="muted">No sessions logged yet.</p></section>`;
 const rows=S.log.map((s,i)=>({s,i})).sort((a,b)=>b.s.date.localeCompare(a.s.date));
 return`<section class="win"><h2>History</h2>${rows.map(({s,i})=>`<div class="ex"><div class="exhead"><h3>${esc(s.day)}</h3><span class="tag">${fmt(s.date)}</span></div>${s.entries.map(e=>`<div class="muted">${esc(EX[e.ex]?EX[e.ex].name:e.ex)}: ${e.sets.join("/")}${e.level?" (step "+e.level+")":""}</div>`).join("")}<div class="row" style="margin-top:8px"><button class="btn small" data-open="${esc(s.date)}">Open day</button><button class="btn small danger" data-del="${i}">Delete</button></div></div>`).join("")}</section>`;}

function bodyView(){const b=[...S.body].sort((x,y)=>x.date.localeCompare(y.date));const w=b.filter(x=>x.weightLb!=null),wa=b.filter(x=>x.waistIn!=null);
 return`<section class="win"><h2>Body log</h2><div class="row"><input type="date" id="bdate" value="${today()}"><input type="number" step="0.1" inputmode="decimal" id="bw" placeholder="Weight lb"><input type="number" step="0.1" inputmode="decimal" id="bwa" placeholder="Waist in"><button class="btn primary" id="bsave">Save</button></div><p class="muted">Weigh in the morning after waking, same conditions each time. Waist at the navel, relaxed.</p></section>
 ${w.length?`<section class="win"><h2>Weight (lb)</h2>${lineChart(w.map(x=>({l:fmt(x.date),v:x.weightLb})),"lb")}</section>`:""}
 ${wa.length?`<section class="win"><h2>Waist (in)</h2>${lineChart(wa.map(x=>({l:fmt(x.date),v:x.waistIn})),"in")}</section>`:""}
 ${b.length?`<section class="win"><h2>Entries</h2><table><thead><tr><th>Date</th><th class="n">Weight</th><th class="n">Waist</th><th></th></tr></thead><tbody>${b.map(x=>`<tr><td>${fmt(x.date)}</td><td class="n">${x.weightLb!=null?x.weightLb:""}</td><td class="n">${x.waistIn!=null?x.waistIn:""}</td><td><button class="btn small danger" data-bdel="${esc(x.date)}">✕</button></td></tr>`).join("")}</tbody></table></section>`:""}`;}

function dataView(){return`<section class="win"><h2>Backup & move devices</h2><p class="muted">Your data lives only in this browser on this device. Export a JSON file regularly; import it on another device to continue. The file uses the same LOG/BODY shape as the Shadow Build page.</p>
 <div class="row"><button class="btn primary" id="export">Export JSON</button><label class="btn" style="text-align:center;display:flex;align-items:center;justify-content:center">Import JSON<input type="file" id="import" accept="application/json,.json" class="hidden"></label></div>
 <p class="muted">${S.log.length} sessions · ${S.body.length} body entries stored.</p><button class="btn danger" id="wipe">Erase all data on this device</button></section>`;}

function render(){renderNav();app.innerHTML=tab==="workout"?workoutView():tab==="progress"?progressView():tab==="history"?historyView():tab==="body"?bodyView():dataView();}

/* ---------------- events ---------------- */
app.addEventListener("input",e=>{const t=e.target;if(t.dataset.key){const dr=draftFor(dk());const arr=dr.sets[t.dataset.key]||[];const v=t.value===""?null:Math.max(0,parseInt(t.value,10));arr[+t.dataset.i]=isNaN(v)?null:v;dr.sets[t.dataset.key]=arr;save();}
 if(t.dataset.note){const dr=draftFor(dk());dr.notes[t.dataset.note]=t.value;save();}});
app.addEventListener("change",e=>{const t=e.target;if(t.dataset.level){const dr=draftFor(dk());dr.levels[t.dataset.level]=+t.value;if(!editing&&sel>=today())S.levels[t.dataset.level]=+t.value;save();render();}
 if(t.id==="progEx"){progEx=t.value;render();}
 if(t.id==="import"&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const log=d.log||d.LOG,body=d.body||d.BODY;if(!Array.isArray(log))throw new Error("no log");
   const ok=log.every(s=>typeof s.date==="string"&&typeof s.day==="string"&&Array.isArray(s.entries)&&s.entries.every(x=>typeof x.ex==="string"&&Array.isArray(x.sets)));if(!ok)throw new Error("bad shape");
   if(!confirm("Replace data on this device with "+log.length+" sessions from the file?"))return;S.log=log;S.body=Array.isArray(body)?body:[];if(d.levels)S.levels=d.levels;editing=null;pick={};save();toast("Imported "+log.length+" session"+(log.length===1?"":"s"));render();}catch(err){toast("Import failed: "+err.message);}};r.readAsText(t.files[0]);}});
app.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.date){selectDate(b.dataset.date);render();return;}
 if(b.id==="wkprev"){shiftWeek(-1);return;}
 if(b.id==="wknext"){shiftWeek(1);return;}
 if(b.id==="wktoday"){selectDate(today());render();return;}
 if(b.id==="startnext"){const N=nextInfo();selectDate(N.target);if(!logsOn(N.target).length)pick[N.target]=N.next;render();const w=document.getElementById("logwin")||document.querySelector("section.summary");if(w)window.scrollTo(0,Math.max(0,w.getBoundingClientRect().top+window.scrollY-document.querySelector("header").offsetHeight-8));return;}
 if(b.dataset.day){pick[sel]=b.dataset.day;render();window.scrollTo(0,0);return;}
 if(b.dataset.rest){startRest(+b.dataset.rest);return;}
 if(b.dataset.edit!=null){const s=S.log[+b.dataset.edit];if(!s)return;editing=s;delete pick[sel];const d=curDay();const dr=S.draft[sel+"|"+d]={sets:{},notes:{},levels:{},extra:[]};
  s.entries.forEach(en=>{const idx=PLAN[s.day]?PLAN[s.day].slots.findIndex(sl=>sl[1]===en.ex):-1;if(idx<0){dr.extra.push(en);return;}const k=en.ex+"#"+idx;dr.sets[k]=(dr.sets[k]||[]).concat(en.sets);dr.levels[en.ex]=en.level||0;if(en.note)dr.notes[en.ex]=en.note;});
  save();render();window.scrollTo(0,0);return;}
 if(b.id==="canceledit"){delete S.draft[dk()];editing=null;delete pick[sel];save();render();window.scrollTo(0,0);return;}
 if(b.dataset.delentry!=null){const i=+b.dataset.delentry;const s=S.log[i];if(!s)return;if(confirm("Delete "+label(s.day)+" logged on "+fmtLong(s.date)+"?")){S.log.splice(i,1);if(editing===s){delete S.draft[dk()];editing=null;}delete pick[sel];save();toast("Entry deleted");render();}return;}
 if(b.id==="finish"){const day=curDay(),k=dk();const dr=draftFor(k);const entries=[];const by={};
  PLAN[day].slots.forEach(([blk,ex],idx)=>{const v=(dr.sets[ex+"#"+idx]||[]).filter(x=>x!=null&&!isNaN(x));if(!v.length)return;if(!by[ex]){by[ex]={ex,sets:[]};const n=(dr.notes[ex]||"").trim();if(n)by[ex].note=n;const lv=dr.levels[ex]!=null?dr.levels[ex]:(S.levels[ex]||0);if(lv)by[ex].level=lv;entries.push(by[ex]);}by[ex].sets.push(...v);});
  if(editing&&dr.extra)dr.extra.forEach(x=>{if(!by[x.ex])entries.push(x);});
  if(!entries.length){toast("Enter reps for at least one set first");return;}
  const rec={date:sel,day,entries,t:Date.now()};
  if(editing&&S.log.indexOf(editing)>=0){rec.t=editing.t||rec.t;S.log[S.log.indexOf(editing)]=rec;}
  else{S.log=S.log.filter(x=>x.date!==sel);S.log.push(rec);}
  delete S.draft[k];editing=null;delete pick[sel];save();toast("Saved · "+PLAN[day].label+" · "+fmtLong(sel));render();window.scrollTo(0,0);return;}
 if(b.dataset.open){selectDate(b.dataset.open);tab="workout";render();window.scrollTo(0,0);return;}
 if(b.dataset.del!=null){if(confirm("Delete this session?")){S.log.splice(+b.dataset.del,1);save();render();}return;}
 if(b.id==="bsave"){const d=document.getElementById("bdate").value||today();const w=parseFloat(document.getElementById("bw").value),wa=parseFloat(document.getElementById("bwa").value);if(isNaN(w)&&isNaN(wa)){toast("Enter weight or waist");return;}
  S.body=S.body.filter(x=>x.date!==d);const en={date:d};if(!isNaN(w))en.weightLb=w;if(!isNaN(wa))en.waistIn=wa;S.body.push(en);save();toast("Saved");render();return;}
 if(b.dataset.bdel){S.body=S.body.filter(x=>x.date!==b.dataset.bdel);save();render();return;}
 if(b.id==="export"){const data={app:"ShadowBuild",version:1,exported:new Date().toISOString(),log:S.log.map(({t,...r})=>r),body:S.body,levels:S.levels};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="shadowbuild-backup-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return;}
 if(b.id==="wipe"){if(confirm("Erase every session and body entry on this device? Export first if unsure.")){S={log:[],body:[],levels:{},draft:{}};editing=null;pick={};save();render();}return;}
});

/* swipe the week bar left/right to change week */
let sx=null,sy=null;
app.addEventListener("touchstart",e=>{if(!e.target.closest("#week"))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
app.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>60&&Math.abs(dy)<40)shiftWeek(dx<0?1:-1);},{passive:true});

/* ---------------- rest timer ---------------- */
let tEnd=0,tInt=null;const tval=document.getElementById("tval");
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();[0,0.25,0.5].forEach(s=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.value=.15;o.start(c.currentTime+s);o.stop(c.currentTime+s+.15);});}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200]);}
function showT(){const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));tval.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left<=0&&tInt){clearInterval(tInt);tInt=null;tval.textContent="GO";beep();}}
function startRest(sec){tEnd=Date.now()+sec*1000;if(tInt)clearInterval(tInt);tInt=setInterval(showT,250);showT();}
document.getElementById("timer").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.rest)startRest(+b.dataset.rest);if(b.id==="tstop"){if(tInt)clearInterval(tInt);tInt=null;tval.textContent="0:00";}});

render();
if(location.protocol.startsWith("http")){const l=document.createElement("link");l.rel="manifest";l.href="manifest.webmanifest";document.head.appendChild(l);}
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
